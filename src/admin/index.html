<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>WHRNXT — Content</title>
</head>
<body>
  <!-- Decap CMS (the editor) — auth handled by GitHub via our OAuth function -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- Link out to the moderation queue.
       Decap has no API for adding a sidebar link — registerAdditionalLink does
       not exist in 3.x — and reaching into its DOM to inject one would break the
       first time it re-renders. This is our own fixed element instead: it cannot
       be affected by anything Decap does, and it disappears cleanly if this file
       is ever replaced.
       The queue reads the GitHub session Decap stored, so following this link
       does not ask for anything. -->
  <a id="whrnxt-review-link" href="/review/">Review queue &#9656;</a>
  <style>
    #whrnxt-review-link{
      position:fixed; right:16px; bottom:16px; z-index:9999;
      background:#ffd166; color:#10131a; font:700 14px/1 system-ui,-apple-system,Segoe UI,sans-serif;
      padding:11px 16px; border-radius:10px; text-decoration:none;
      box-shadow:0 6px 18px rgba(0,0,0,.28);
    }
    #whrnxt-review-link:hover{ background:#ffdd80; }
    @media print{ #whrnxt-review-link{ display:none; } }
  </style>
</body>
</html>
