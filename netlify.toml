# Netlify build config — nothing to set in the dashboard.
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# Decap CMS GitHub OAuth handler
[functions]
  directory = "netlify/functions"

# /review/ was the moderation queue before the dashboard existed. It is gone, and
# the dashboard does both queues, so anyone with the old URL bookmarked lands in
# the right place rather than on a 404.
[[redirects]]
  from = "/review"
  to = "/admin/"
  status = 301
  force = true

[[redirects]]
  from = "/review/*"
  to = "/admin/"
  status = 301
  force = true
